<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find a Free Room — Manav Rachna University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0F2; --card:#FFFFFF; --ink:#16213E; --ink-soft:#4A5570;
  --line:#D8DCE1; --amber:#C9722E; --amber-bg:#FBEADF; --teal:#1F6F5C; --teal-bg:#E4F1EC;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181F; --card:#1D222C; --ink:#EDEFF3; --ink-soft:#A6ADBB;
    --line:#323949; --amber:#E08A46; --amber-bg:#3A2A1C; --teal:#4FA893; --teal-bg:#1C332E;
  }
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:'IBM Plex Sans',sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px}
header{margin-bottom:22px}
.eyebrow{font-size:13px;color:var(--ink-soft);letter-spacing:.02em}
h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(28px,5vw,40px);margin:2px 0 18px;line-height:1.1}
.search-row{display:flex;gap:10px;flex-wrap:wrap}
input#roomInput{
  flex:1;min-width:220px;padding:13px 16px;font-size:16px;border:1.5px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink);font-family:inherit;
}
input#roomInput:focus{outline:2px solid var(--amber);outline-offset:1px}
button{
  font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:15px;
  border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);
  padding:13px 18px;cursor:pointer;
}
button:hover{border-color:var(--ink-soft)}
button:focus-visible, a:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.status{
  display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:12px;
  background:var(--teal-bg);border:1px solid var(--teal);margin-bottom:22px;
}
.status.busy{background:var(--amber-bg);border-color:var(--amber)}
.status .dot{width:10px;height:10px;border-radius:50%;background:var(--teal);flex:none}
.status.busy .dot{background:var(--amber)}
.status b{font-weight:600}
.status .sub{color:var(--ink-soft);font-size:13px;display:block;margin-top:2px}

.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top}
th:last-child,td:last-child{border-right:none}
tr:last-child td{border-bottom:none}
th{
  background:var(--paper);font-weight:500;font-size:12.5px;color:var(--ink-soft);
  padding:10px 8px;text-align:left;position:sticky;top:0;
}
th .ptime{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;margin-top:2px}
td.daycell{
  font-family:'Fraunces',serif;font-weight:600;font-size:15px;padding:12px 10px;
  background:var(--paper);white-space:nowrap;
}
td.slot{padding:9px 9px;font-size:12.5px;line-height:1.35;min-width:96px;max-width:150px}
td.slot.lunch{background:repeating-linear-gradient(135deg,var(--paper),var(--paper) 6px,transparent 6px,transparent 12px);color:var(--ink-soft);text-align:center;font-style:italic}
td.slot .subj{white-space:pre-line}
td.slot.free{color:var(--ink-soft)}
td.slot.now{background:var(--amber-bg);box-shadow:inset 0 0 0 2px var(--amber)}
td.today{background:color-mix(in srgb, var(--teal-bg) 45%, var(--card))}

.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.note{font-size:12.5px;color:var(--ink-soft);margin-top:18px;line-height:1.5}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.filters select{padding:11px 12px;font-size:14.5px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:inherit}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:14px;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;user-select:none}
.chk input{accent-color:var(--amber)}

.roomlist{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.roomcard{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:13px 15px;cursor:pointer;text-align:left;font-family:inherit}
.roomcard:hover{border-color:var(--teal)}
.roomcode{font-family:'Fraunces',serif;font-weight:600;font-size:18px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font-size:11.5px;padding:3px 8px;border-radius:999px;background:var(--teal-bg);color:var(--teal);font-weight:500}
.badge.none{background:var(--paper);color:var(--ink-soft)}
.resultcount{font-size:13px;color:var(--ink-soft);margin-bottom:12px}
.facname{font-family:'Fraunces',serif;font-size:26px;font-weight:600;margin:0 0 4px}
.subline{color:var(--ink-soft);font-size:14px;margin-bottom:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Manav Rachna University, Sector 43, Faridabad</div>
    <h1>Find a Free Room</h1>
  </header>

  <div class="search-row">
    <input id="roomInput" list="roomList" placeholder="Type a room code to check it directly, e.g. HF04…" autocomplete="off">
    <datalist id="roomList"></datalist>
  </div>
  <div class="filters">
    <select id="daySel"></select>
    <select id="periodSel"></select>
    <label class="chk"><input type="checkbox" id="needProjector"> Needs projector</label>
    <label class="chk"><input type="checkbox" id="needPanel"> Needs smart panel</label>
  </div>

  <div id="roomResultWrap">
    <div class="resultcount" id="roomResultCount"></div>
    <div class="roomlist" id="roomList2"></div>
  </div>

  <div id="roomCard" style="display:none;margin-top:26px">
    <div class="facname" id="roomCode"></div>
    <div class="subline" id="roomSub"></div>
    <div class="badges" id="roomBadges" style="margin-bottom:16px"></div>
    <div class="status" id="roomStatusBox">
      <span class="dot"></span>
      <div><b id="roomStatusMain"></b><span class="sub" id="roomStatusSub"></span></div>
    </div>
    <div class="gridwrap">
      <table id="roomGrid"></table>
    </div>
    <div class="legend">
      <span><i style="background:var(--amber-bg);box-shadow:inset 0 0 0 2px var(--amber)"></i>Current period</span>
      <span><i style="background:color-mix(in srgb, var(--teal-bg) 45%, var(--card))"></i>Today</span>
    </div>
    <p class="note"><button type="button" id="backBtn" style="margin-top:8px">← Back to free rooms list</button></p>
  </div>
</div>

function toMin(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function nowIST(){
  const parts = new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const map = {}; parts.forEach(p=>map[p.type]=p.value);
  const wdMap = {Mon:'Mo',Tue:'Tu',Wed:'We',Thu:'Th',Fri:'Fr',Sat:'Sa',Sun:'Su'};
  return {day: wdMap[map.weekday], minutes: parseInt(map.hour)*60+parseInt(map.minute)};
}
function currentPeriodIndex(minutes){
  for(let i=0;i<PERIODS.length;i++){
    const p = PERIODS[i];
    if(p==='Lunch') continue;
    const [s,e] = TIMES[p].split('-');
    if(minutes>=toMin(s) && minutes<toMin(e)) return i;
  }
  return -1;
}

function buildGridHTML(sch, todayCode, curIdx){
  let html = '<thead><tr><th></th>';
  PERIODS.forEach(p=>{ html += `<th>${p==='Lunch'?'Lunch':'P'+p}<span class="ptime">${TIMES[p]}</span></th>`; });
  html += '</tr></thead><tbody>';
  DAYS.forEach(d=>{
    const isToday = d===todayCode;
    html += `<tr><td class="daycell${isToday?' today':''}">${DAY_NAMES[d]}</td>`;
    PERIODS.forEach((p,i)=>{
      const isNow = isToday && i===curIdx;
      if(p==='Lunch'){ html += `<td class="slot lunch${isToday?' today':''}">Lunch</td>`; return; }
      const val = sch[d] && sch[d][p];
      const cls = ['slot']; if(!val) cls.push('free'); if(isToday) cls.push('today'); if(isNow) cls.push('now');
      html += `<td class="${cls.join(' ')}">${val ? `<span class="subj">${escapeHtml(val)}</span>` : '—'}</td>`;
    });
    html += '</tr>';
  });
  return html + '</tbody>';
}

const roomInput = document.getElementById('roomInput');
const roomListEl = document.getElementById('roomList');
const daySel = document.getElementById('daySel');
const periodSel = document.getElementById('periodSel');
const needProjector = document.getElementById('needProjector');
const needPanel = document.getElementById('needPanel');
const roomResultWrap = document.getElementById('roomResultWrap');
const roomCardEl = document.getElementById('roomCard');

ROOMDATA.rooms.forEach(r=>{ const o=document.createElement('option'); o.value=r.code; roomListEl.appendChild(o); });
DAYS.forEach(d=>{ const o=document.createElement('option'); o.value=d; o.textContent=DAY_NAMES[d]; daySel.appendChild(o); });
PERIODS.forEach(p=>{ if(p==='Lunch') return; const o=document.createElement('option'); o.value=p; o.textContent=`Period ${p} · ${TIMES[p]}`; periodSel.appendChild(o); });

function equipBadges(room){
  const b = [];
  if(room.projector) b.push(`<span class="badge">📽 Projector</span>`);
  if(room.panel) b.push(`<span class="badge">🖥 Smart panel</span>`);
  if(!room.projector && !room.panel) b.push(`<span class="badge none">No equipment on file</span>`);
  return b.join('');
}

function setDefaultDayPeriod(){
  const {day, minutes} = nowIST();
  const idx = currentPeriodIndex(minutes);
  daySel.value = DAYS.includes(day) ? day : 'Mo';
  periodSel.value = idx>=0 ? PERIODS[idx] : PERIODS[0];
}
setDefaultDayPeriod();

function renderRoomList(){
  const day = daySel.value, period = periodSel.value;
  const needP = needProjector.checked, needS = needPanel.checked;
  const free = ROOMDATA.rooms.filter(r=>{
    if(r.sch[day] && r.sch[day][period]) return false;
    if(needP && !r.projector) return false;
    if(needS && !r.panel) return false;
    return true;
  });
  document.getElementById('roomResultCount').textContent =
    `${free.length} of ${ROOMDATA.rooms.length} rooms free for Period ${period} (${TIMES[period]}) on ${DAY_NAMES[day]}`;
  const listEl = document.getElementById('roomList2');
  listEl.innerHTML = free.map(r=>`
    <button class="roomcard" type="button" data-code="${escapeHtml(r.code)}">
      <div class="roomcode">${escapeHtml(r.code)}</div>
      <div class="badges">${equipBadges(r)}</div>
    </button>`).join('') || `<p class="note">No free rooms match these filters.</p>`;
  listEl.querySelectorAll('.roomcard').forEach(el=>{
    el.addEventListener('click', ()=>{ roomInput.value = el.dataset.code; showRoom(el.dataset.code); });
  });
  roomResultWrap.style.display='block';
  roomCardEl.style.display='none';
}
[daySel, periodSel, needProjector, needPanel].forEach(el=>el.addEventListener('change', renderRoomList));

function showRoom(code){
  const room = ROOMDATA.rooms.find(r=>r.code.toLowerCase()===code.toLowerCase());
  if(!room){ roomCardEl.style.display='none'; return; }
  const {day: todayCode, minutes} = nowIST();
  const curIdx = DAYS.includes(todayCode) ? currentPeriodIndex(minutes) : -1;

  document.getElementById('roomCode').textContent = room.code;
  document.getElementById('roomSub').textContent = `${room.busy} session${room.busy===1?'':'s'} scheduled this week`;
  document.getElementById('roomBadges').innerHTML = equipBadges(room);

  const box = document.getElementById('roomStatusBox');
  const main = document.getElementById('roomStatusMain');
  const sub = document.getElementById('roomStatusSub');
  if(!DAYS.includes(todayCode)){
    box.className='status'; main.textContent='No classes scheduled today'; sub.textContent='';
  } else if(curIdx>=0 && room.sch[todayCode] && room.sch[todayCode][PERIODS[curIdx]]){
    const txt = room.sch[todayCode][PERIODS[curIdx]].split('\n');
    box.className='status busy'; main.textContent = `Occupied right now — ${txt[0]}`;
    sub.textContent = `Period ${PERIODS[curIdx]} · ${TIMES[PERIODS[curIdx]]}` + (txt.length>1?` · ${txt.slice(1).join(' · ')}`:'');
  } else if(curIdx>=0){
    box.className='status'; main.textContent='Free right now';
    sub.textContent = `Period ${PERIODS[curIdx]} · ${TIMES[PERIODS[curIdx]]}`;
  } else {
    box.className='status'; main.textContent='Outside teaching hours'; sub.textContent='';
  }

  document.getElementById('roomGrid').innerHTML = buildGridHTML(room.sch, todayCode, curIdx);
  roomCardEl.style.display='block';
  roomResultWrap.style.display='none';
}

roomInput.addEventListener('input', ()=>{
  if(!roomInput.value){ roomCardEl.style.display='none'; roomResultWrap.style.display='block'; return; }
  const match = ROOMDATA.rooms.find(r=>r.code.toLowerCase()===roomInput.value.toLowerCase());
  if(match) showRoom(roomInput.value);
});

document.getElementById('backBtn').addEventListener('click', ()=>{
  roomInput.value = '';
  roomCardEl.style.display='none';
  roomResultWrap.style.display='block';
  renderRoomList();
});

renderRoomList();
</script>
</body>
</html>
